name: Release to NuGet

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  id-token: write  # GitHub OIDC token for NuGet trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # The release text is the CHANGELOG.md section of the tag; a tag without one stops before anything is published.
      - name: Extract release notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section ## [${GITHUB_REF_NAME}]"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --solution DotNetOpenApiExtract.slnx --no-build --configuration Release --verbosity normal --results-directory TestResults -- --report-xunit-trx --report-xunit-trx-filename tests.trx

      - name: Pack CLI tool
        run: dotnet pack src/DotNetOpenApiExtract.Cli/DotNetOpenApiExtract.Cli.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Pack Core library
        run: dotnet pack src/DotNetOpenApiExtract.Core/DotNetOpenApiExtract.Core.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkg

      # Trusted publishing: nuget.org exchanges the workflow's OIDC token for a short-lived API key.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: ./nupkg/*.nupkg
